<div class="confirm-backdrop" *ngIf="isOpen" (click)="cancelled.emit()"></div>

<section class="confirm-dialog" *ngIf="isOpen" role="dialog" aria-modal="true" [attr.aria-label]="title">
  <button type="button" class="dialog-close" (click)="cancelled.emit()" aria-label="Close confirmation dialog">×</button>

  <div class="dialog-icon" [class.danger]="danger">
    {{ danger ? '!' : '?' }}
  </div>

  <h2>{{ title }}</h2>
  <p>{{ message }}</p>

  <div class="dialog-actions">
    <button type="button" class="cancel-btn" (click)="cancelled.emit()">{{ cancelLabel }}</button>
    <button type="button" class="confirm-btn" [class.danger]="danger" (click)="confirmed.emit()">
      {{ confirmLabel }}
    </button>
  </div>
</section>
