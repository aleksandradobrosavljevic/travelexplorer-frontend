<aside class="sidebar" [class.collapsed]="isCollapsed">

  <!-- Logo -->
  <div class="sidebar-logo">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2"/>
      </svg>
    </div>
    <div class="logo-text">
      <h2>Global Control</h2>
      <p>Super Admin Panel</p>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">

    <span class="nav-section-label">Overview</span>

    <a routerLink="/super-admin/analytics" routerLinkActive="active-link"
       [routerLinkActiveOptions]="{ exact: true }" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      <span>Analytics</span>
    </a>

    <a routerLink="/super-admin/users" routerLinkActive="active-link" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
        <circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
        <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <span>Users</span>
    </a>

    <span class="nav-section-label">Content</span>

    <a routerLink="/super-admin/destinations" routerLinkActive="active-link" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      <span>Destinations</span>
    </a>

    <a routerLink="/super-admin/map" routerLinkActive="active-link" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <path d="M3 9h18M9 21V9"/>
      </svg>
      <span>Map</span>
    </a>

    <span class="nav-section-label">System</span>

    <a routerLink="/super-admin/audit-log" routerLinkActive="active-link" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
      </svg>
      <span>Audit Log</span>
    </a>

    <a routerLink="/super-admin/destination-admins" routerLinkActive="active-link" class="nav-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <span>Destination Admins</span>
    </a>

  </nav>

  <!-- Bottom -->
  <div class="sidebar-bottom">

    <button class="collapse-btn" (click)="toggleSidebar()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           [class.rotated]="isCollapsed">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
      <span>Collapse</span>
    </button>

    <button class="sidebar-user" type="button" (click)="openProfileModal()" aria-label="Open super admin profile">
      <div class="user-avatar">
        <img *ngIf="profile().avatarUrl" [src]="profile().avatarUrl" alt="Avatar" class="user-avatar-img" />
        <span *ngIf="!profile().avatarUrl">{{ avatarInitials() }}</span>
      </div>
      <div class="user-info">
        <p>{{ displayName() }}</p>
        <small>{{ profile().email }}</small>
      </div>
    </button>

    <button class="logout-btn" (click)="onLogout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span>Sign Out</span>
    </button>

  </div>

</aside>

<!-- Backdrop -->
<div class="profile-modal-backdrop" *ngIf="isProfileModalOpen()" (click)="closeProfileModal()"></div>

<!-- Profile Modal -->
<section class="profile-modal" *ngIf="isProfileModalOpen()" (click)="$event.stopPropagation()">

  <!-- Fixed header -->
  <div class="profile-modal-top">
    <div class="profile-modal-header">

      <!-- Avatar with camera button -->
      <div class="profile-modal-avatar-wrap"
           (click)="triggerAvatarUpload()"
           [class.uploading]="isUploadingAvatar()"
           title="Change photo">
        <div class="profile-modal-avatar">
          <img *ngIf="profile().avatarUrl" [src]="profile().avatarUrl" alt="Avatar" class="avatar-img" />
          <span *ngIf="!profile().avatarUrl">{{ avatarInitials() }}</span>
        </div>
        <div class="avatar-cam-btn" aria-label="Change photo">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" width="10" height="10">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </div>
        <div class="avatar-uploading-overlay" *ngIf="isUploadingAvatar()">
          <div class="spinner"></div>
        </div>
      </div>
      <button
        *ngIf="profile().avatarUrl"
        type="button"
        class="avatar-remove-btn"
        [disabled]="isUploadingAvatar()"
        (click)="removeAvatar()">
        Remove
      </button>

      <div class="profile-modal-title">
        <h2>{{ displayName() }}</h2>
        <span class="role-badge">{{ roleLabel() }}</span>
      </div>
    </div>
    <button class="profile-modal-close" type="button" (click)="closeProfileModal()" aria-label="Close profile">
      &times;
    </button>
  </div>

  <!-- Scrollable body -->
  <div class="profile-modal-body">

    <!-- Personal information -->
    <p class="modal-section-label">Personal information</p>
    <div class="profile-fields">
      <div class="profile-field">
        <label for="editFirstName">First name</label>
        <input id="editFirstName" type="text"
               [ngModel]="editFirstName()"
               (ngModelChange)="editFirstName.set($event)" />
      </div>
      <div class="profile-field">
        <label for="editLastName">Last name</label>
        <input id="editLastName" type="text"
               [ngModel]="editLastName()"
               (ngModelChange)="editLastName.set($event)" />
      </div>
      <div class="profile-field profile-field-full">
        <label for="editEmail">Email address</label>
        <input id="editEmail" type="email"
               [ngModel]="editEmail()"
               (ngModelChange)="editEmail.set($event)" />
      </div>
    </div>
    <div class="profile-field-actions">
      <button class="btn-discard" type="button" (click)="discardProfile()" [disabled]="!profileHasChanges() || isSavingProfile()">Discard</button>
      <button class="btn-save" type="button" (click)="saveProfile()" [disabled]="!profileHasChanges() || isSavingProfile()">
        {{ isSavingProfile() ? 'Saving...' : 'Save changes' }}
      </button>
    </div>

    <hr class="modal-divider" />

    <!-- Change password -->
    <p class="modal-section-label">Change password</p>
    <p class="modal-section-sub">Confirm your current password before setting a new one.</p>

    <form class="password-form" (ngSubmit)="changePassword()">
      <div class="profile-field">
        <label for="currentPassword">Current password</label>
        <div class="password-field-wrapper">
          <input id="currentPassword"
                 [type]="showOldPassword() ? 'text' : 'password'"
                 autocomplete="current-password"
                 [ngModel]="passwordData().oldPassword"
                 (ngModelChange)="updatePasswordField('oldPassword', $event)"
                 name="currentPassword" />
          <button type="button" class="toggle-password-btn"
                  (click)="togglePasswordVisibility('oldPassword')"
                  [attr.aria-label]="showOldPassword() ? 'Hide current password' : 'Show current password'">
            <span class="material-icons">{{ showOldPassword() ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
      </div>

      <div class="profile-field">
        <label for="newPassword">New password</label>
        <div class="password-field-wrapper">
          <input id="newPassword"
                 [type]="showNewPassword() ? 'text' : 'password'"
                 autocomplete="new-password"
                 [ngModel]="passwordData().newPassword"
                 (ngModelChange)="updatePasswordField('newPassword', $event)"
                 name="newPassword" />
          <button type="button" class="toggle-password-btn"
                  (click)="togglePasswordVisibility('newPassword')"
                  [attr.aria-label]="showNewPassword() ? 'Hide new password' : 'Show new password'">
            <span class="material-icons">{{ showNewPassword() ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
      </div>

      <div class="profile-field">
        <label for="confirmPassword">Confirm new password</label>
        <div class="password-field-wrapper">
          <input id="confirmPassword"
                 [type]="showConfirmPassword() ? 'text' : 'password'"
                 autocomplete="new-password"
                 [ngModel]="passwordData().confirmPassword"
                 (ngModelChange)="updatePasswordField('confirmPassword', $event)"
                 name="confirmPassword" />
          <button type="button" class="toggle-password-btn"
                  (click)="togglePasswordVisibility('confirmPassword')"
                  [attr.aria-label]="showConfirmPassword() ? 'Hide confirmation password' : 'Show confirmation password'">
            <span class="material-icons">{{ showConfirmPassword() ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
      </div>

      <div class="profile-modal-actions">
        <button class="modal-cancel-btn" type="button" (click)="closeProfileModal()">Cancel</button>
        <button class="modal-confirm-btn" type="submit" [disabled]="isSavingPassword()">
          {{ isSavingPassword() ? 'Saving...' : 'Update password' }}
        </button>
      </div>
    </form>

  </div>
</section>
